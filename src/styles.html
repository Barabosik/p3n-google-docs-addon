<style>
/* On top of Google's CSS package for Editor add-ons (add-ons1.css, linked first in Sidebar.html), as Google's
   review asks: its type, buttons, fields and link colour. p3n keeps its logo, wordmark and score colours. */
:root {
  --ink: #222;
  --muted: #777;
  --tint: #f8f8f8;
  --rule: #ebebeb;
  --link: #15c;
  --blue: #4d90fe;
  --radius: 4px;
  /* p3n's score colours, the same tokens as p3n.si and the browser extension. */
  --accent: #c2410c;
  --amber: #b45309;
  --amber-bar: #f59e0b;
  --green: #047857;
  --green-bar: #059669;
  --highlight: #fcd9c4;
  /* Motion: enter with ease-out, travel with ease-in-out, never bounce. */
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-in-out: cubic-bezier(0.76, 0, 0.24, 1);
  --t-hover: 180ms;
  --t-ui: 240ms;
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scrollbar-width: thin; scrollbar-color: #dcdcdc transparent; }
body { background: #fff; display: flex; flex-direction: column; min-height: 100vh; }
::selection { background: var(--highlight); color: var(--ink); }
h1, h2, h3 { margin: 0; color: var(--ink); text-wrap: balance; }
p { margin: 0; }
code { font-size: 12px; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }

.small { font-size: 12px; line-height: 17px; color: inherit; }
.muted { color: var(--muted); }
.strong { font-weight: bold; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.between { justify-content: space-between; }
.push { margin-left: auto; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* Buttons are Google's. One per view gets "action" (blue): see refreshPrimary in app.html. */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; margin: 0; }
button + button, .button + .button { margin-left: 0; } /* rows space their buttons with gap */
a.button { line-height: 27px; padding: 0 12px; }
.btn .tick { width: 13px; height: 13px; flex: none; }
.tick path { stroke-dasharray: 20; stroke-dashoffset: 20; animation: tick 320ms var(--ease-out) 60ms forwards; }
@keyframes tick { to { stroke-dashoffset: 0; } }

/* Text buttons: Google's link look, not its grey button. */
.link { all: unset; color: var(--link); cursor: pointer; font: inherit; }
.link.small { font-size: 12px; line-height: 17px; }
.link.push { margin-left: auto; }
.link:hover { text-decoration: underline; }
.link:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
.link:disabled { color: var(--muted); cursor: default; text-decoration: none; }

textarea, input[type="password"] { width: 100%; }
textarea { resize: vertical; min-height: 96px; line-height: 18px; padding: 6px; caret-color: var(--blue); }

.note { border-radius: var(--radius); padding: 8px 10px; background: var(--tint); }
.note.warn { background: #fef7e0; color: #7a4a00; }
.note.error { background: #fce8e6; color: #a50e0e; }
.note.ok { background: #e6f4ea; color: #0d652d; }

/* ---- layout: Docs gives the sidebar 300px ---- */
main { flex: 1; padding: 0 12px 16px; display: flex; flex-direction: column; gap: 16px; }
header.bar { display: flex; align-items: center; gap: 8px; padding: 12px 12px 10px; }
.brand { display: inline-flex; align-items: center; gap: 7px; color: #16130f; text-decoration: none; }
.brand:hover { text-decoration: none; }
.wordmark { font-size: 19px; font-weight: bold; letter-spacing: -0.02em; }
.wordmark span { color: var(--accent); }
.badge { font-size: 11px; font-weight: bold; line-height: 1; padding: 4px 7px; border-radius: 999px; background: #fef7e0; color: #7a4a00; }

.input { display: flex; flex-direction: column; gap: 8px; }
.input .actions .btn { flex: 1; }

/* Busy: shows only after a beat, so a quick answer doesn't flash it. */
.busy { display: flex; flex-direction: column; gap: 8px; animation: appear var(--t-ui) var(--ease-out) 150ms both; }
.progress { height: 4px; border-radius: 2px; background: var(--rule); overflow: hidden; }
.progress i { display: block; height: 100%; width: 40%; border-radius: 2px; background: linear-gradient(90deg, transparent, var(--blue) 70%); animation: slide 1.4s var(--ease-in-out) infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
@keyframes appear { from { opacity: 0; } }

/* Text arriving from the document lands in the box with a brief highlight. */
textarea.arrived { animation: arrive 900ms var(--ease-out); }
@keyframes arrive { from { background-color: var(--highlight); } }

/* The result: parts arrive in reading order (--i is set in app.html), the score runs, flagged sentences get
   highlighted like a pen stroke, and a rewrite wipes in. */
#result:empty { display: none; }
.result-in > * { animation: rise var(--t-ui) var(--ease-out) both; animation-delay: calc(min(var(--i, 0), 6) * 50ms); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
.rewrite {
  -webkit-mask: linear-gradient(180deg, #000 40%, transparent 60%) 0 100% / 100% 260% no-repeat;
  mask: linear-gradient(180deg, #000 40%, transparent 60%) 0 100% / 100% 260% no-repeat;
  animation: wipe 650ms var(--ease-out) 100ms both;
}
@keyframes wipe { from { -webkit-mask-position: 0 100%; mask-position: 0 100%; } to { -webkit-mask-position: 0 0; mask-position: 0 0; } }
.quotes li.hit q { background: linear-gradient(var(--highlight), var(--highlight)) no-repeat 0 0 / 0% 100%; animation: sweep 600ms var(--ease-out) both; animation-delay: calc(250ms + min(var(--j, 0), 4) * 140ms); }
@keyframes sweep { to { background-size: 100% 100%; } }

.score { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.score .label { font-size: 17px; font-weight: bold; line-height: 22px; }
.score .pct { font-size: 32px; font-weight: bold; line-height: 1; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; transition: color var(--t-hover) ease; }
.score .pct small { display: block; font-size: 11px; font-weight: normal; color: var(--muted); margin-top: 4px; }
.score .pct .from { font-size: 17px; color: var(--muted); }
.meter { height: 6px; border-radius: 3px; background: var(--rule); overflow: hidden; }
.meter i { display: block; height: 100%; transform-origin: left; transition: background-color var(--t-hover) ease; }

.t-ai { color: var(--accent); } .b-ai { background: var(--accent); }
.t-mid { color: var(--amber); } .b-mid { background: var(--amber-bar); }
.t-human { color: var(--green); } .b-human { background: var(--green-bar); }

h3 { font-size: 13px; font-weight: bold; line-height: 18px; margin-bottom: 6px; }
.quotes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.quotes li { padding: 8px 10px; border-radius: var(--radius); background: var(--tint); }
.quotes q { padding: 1px 0; font-style: italic; }
.quotes .why { display: block; font-size: 11px; line-height: 16px; color: var(--muted); margin-bottom: 2px; }

.rewrite { white-space: pre-wrap; background: var(--tint); border: 1px solid var(--rule); border-radius: var(--radius); padding: 10px; line-height: 19px; }

footer#quota { padding: 10px 12px 14px; }
footer#quota:empty { display: none; }

/* ---- settings: the API key, over the main view ---- */
.settings { flex: 1; padding: 2px 12px 16px; display: flex; flex-direction: column; gap: 10px; }
.settings h2 { font-size: 16px; line-height: 24px; }
.settings h2:focus { outline: none; }
.settings .sub { font-size: 14px; margin-top: 12px; }

/* Switching views: the new one slides in from the side it belongs on. */
::view-transition-old(root) { animation: 160ms ease both fade-out; }
::view-transition-new(root) { animation: 260ms var(--ease-out) both slide-in; }
:root[data-view="main"]::view-transition-new(root) { animation-name: slide-back; }
@keyframes fade-out { to { opacity: 0; } }
@keyframes slide-in { from { opacity: 0; transform: translateX(14px); } }
@keyframes slide-back { from { opacity: 0; transform: translateX(-14px); } }

@media (prefers-reduced-motion: reduce) {
  .progress i { animation: none; width: 100%; background: var(--blue); opacity: .5; }
  .result-in > * { animation: appear 150ms ease both; }
  .rewrite { -webkit-mask: none; mask: none; animation: none; }
  .quotes li.hit q { animation: none; background-size: 100% 100%; }
  .tick path { animation: none; stroke-dashoffset: 0; }
  textarea.arrived { animation: none; }
  ::view-transition-old(root), ::view-transition-new(root) { animation: none; }
}
</style>
