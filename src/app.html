<script>
// The sidebar's controller: the text box, running a skill, showing the result, Replace, and the key screen. It talks
// to the document only through the host adapter (host.html) and to p3n only through the API client (api.html, or
// mock.html in mock mode); the result markup and motion are in render.html.
(() => {
  const HOST = window.P3N_HOST;
  const R = window.P3N_RENDER;
  const { ApiError, LINKS, MAX_CHARS } = window.P3N_API;
  const api = HOST.mock ? window.P3N_MOCK : window.P3N_API;
  const { h } = R;

  const $ = (s) => document.querySelector(s);
  const els = {
    text: $('#text'), count: $('#count'), check: $('#check'), rewrite: $('#rewrite'), grab: $('#grab'), hint: $('#hint'),
    busy: $('#busy'), busyText: $('#busy-text'), cancel: $('#cancel'), result: $('#result'), foot: $('#foot'), quota: $('#quota'), account: $('#account'),
    main: $('#main'), settings: $('#settings'), back: $('#back'), key: $('#key'), keyStatus: $('#key-status'), remove: $('#remove'), mock: $('#mock'),
  };
  // source: the document text in the box ({ text, editable, blocked }), so Replace can put a rewrite back.
  // fromDoc: the box still shows the document's text, so Check and Rewrite take the current selection.
  const state = { source: null, fromDoc: false, controller: null, reading: false, timer: null };
  const key = () => HOST.getKey();
  const limit = () => (key() ? MAX_CHARS.key : MAX_CHARS.free);

  // Text arriving from the document lands in the box with a brief highlight.
  function arrived() {
    els.text.classList.remove('arrived');
    void els.text.offsetWidth; // restart the animation
    els.text.classList.add('arrived');
  }

  // ---- input -------------------------------------------------------------------------------------

  function refreshInput() {
    const n = els.text.value.trim().length;
    els.count.textContent = n ? `${n.toLocaleString()} / ${limit().toLocaleString()}` : '';
    els.count.title = n ? `${n.toLocaleString()} of up to ${limit().toLocaleString()} characters` : '';
    els.count.classList.toggle('t-ai', n > limit());
    const busy = !!state.controller || state.reading;
    // With a document, the buttons work with an empty box: they take the selection.
    els.check.disabled = busy || (!n && !HOST.available);
    els.rewrite.disabled = busy || (!n && !HOST.available);
    els.grab.hidden = !HOST.available;
    els.grab.disabled = busy;
  }

  function hint(msg) {
    els.hint.textContent = msg || '';
    els.hint.hidden = !msg;
  }

  // Google's review asks for one blue primary action per view: the result's own when it offers one that can still
  // be clicked (Replace selection, Sign up, Top up, marked data-primary in render.html), Check for AI otherwise.
  function refreshPrimary() {
    const pick = [...els.result.querySelectorAll('[data-primary]')].find((b) => !b.disabled) ?? els.check;
    for (const b of document.querySelectorAll('.action')) if (b !== pick) b.classList.remove('action');
    pick.classList.add('action');
  }
  new MutationObserver(refreshPrimary).observe(els.result, { childList: true, subtree: true, attributes: true, attributeFilter: ['disabled'] });

  // Reads the selection into the box. Only reads the document; nothing is sent to p3n. `quiet`: no hint when
  // nothing is selected; `background`: the controls stay as they are while it reads (the read on opening).
  async function grab({ quiet = false, background = false } = {}) {
    hint('');
    if (!background) {
      state.reading = true;
      els.grab.textContent = 'Reading…';
      refreshInput();
    }
    try {
      const got = await HOST.grabSelection();
      if (!got.text) {
        if (!quiet) hint('Nothing is selected. Select text in the document first.');
        return null;
      }
      // Opening read: if the user started typing or clicked Check meanwhile, that wins.
      if (background && (els.text.value.trim() || state.controller || state.reading)) return null;
      if (got.text !== els.text.value) {
        els.text.value = got.text;
        arrived();
      }
      state.source = got;
      state.fromDoc = true;
      return got.text;
    } catch (e) {
      if (!quiet) hint(e.message);
      return null;
    } finally {
      if (!background) {
        state.reading = false;
        els.grab.textContent = 'Use selection';
      }
      refreshInput();
    }
  }

  // Check and Rewrite take the document's selection when the box is empty or still shows text from the
  // document, so a new selection is picked up without another click. Text typed or pasted in the box is used as is.
  async function go(skill) {
    let text = els.text.value;
    if (HOST.available && (!text.trim() || state.fromDoc)) {
      setBusy('read');
      const got = await grab({ quiet: !!text.trim() });
      if (got) text = got;
    }
    if (text.trim()) start(skill, text);
    else setBusy(null);
  }

  els.text.addEventListener('input', () => {
    state.fromDoc = !!state.source && els.text.value === state.source.text;
    refreshInput();
  });
  els.text.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && !els.check.disabled) { e.preventDefault(); go('detect'); }
  });
  els.check.addEventListener('click', () => go('detect'));
  els.rewrite.addEventListener('click', () => go('humanize'));
  els.grab.addEventListener('click', () => grab());
  els.cancel.addEventListener('click', () => state.controller?.abort());

  // ---- running a skill ---------------------------------------------------------------------------

  async function start(skill, text, options) {
    text = (text || '').trim();
    if (!text) return;
    state.controller?.abort();
    if (text.length > limit()) {
      setBusy(null);
      return showError(new ApiError(422, 'too_long', key()
        ? `That's ${text.length.toLocaleString()} characters; the API takes up to ${MAX_CHARS.key.toLocaleString()}. Select less.`
        : `That's ${text.length.toLocaleString()} characters. Without an API key p3n takes up to ${MAX_CHARS.free.toLocaleString()}. Select less, or add a key.`));
    }
    const controller = new AbortController();
    state.controller = controller;
    els.result.replaceChildren();
    if (!state.reading) hint('');
    setBusy(skill);
    refreshInput();
    try {
      const { run, free } = await api.runSkill(skill, text, { key: key(), options, signal: controller.signal });
      if (free != null) HOST.free.set(free);
      render(run, text, skill);
    } catch (e) {
      if (e.name !== 'AbortError') showError(e);
      if (e.free != null) HOST.free.set(e.free);
    } finally {
      if (state.controller === controller) state.controller = null;
      setBusy(null);
      refreshInput();
      refreshAccount();
    }
  }

  function setBusy(what) {
    clearInterval(state.timer);
    els.busy.hidden = !what;
    if (!what) return;
    if (what === 'read') {
      els.busyText.textContent = 'Reading the selection…';
      els.cancel.hidden = true;
      return;
    }
    els.cancel.hidden = false;
    const t0 = Date.now();
    const verb = what === 'detect' ? 'Checking' : 'Rewriting';
    const tick = () => {
      const s = Math.round((Date.now() - t0) / 1000);
      els.busyText.textContent = `${verb}… ${s} s` + (what === 'humanize' && s > 8 ? ' (a rewrite takes up to a minute)' : '');
    };
    tick();
    state.timer = setInterval(tick, 1000);
  }

  // ---- results -----------------------------------------------------------------------------------

  const BLOCKED = {
    table: 'The selection has a table in it',
    picture: 'The selection has a picture or drawing in it',
    equation: 'The selection has an equation in it',
    footnote: 'The selection has a footnote in it',
    chip: 'The selection has a smart chip in it (a person, date or link)',
    other: 'The selection has more than plain text in it',
  };

  function render(run, text, skill) {
    // An answer without what the sidebar shows is a failed run to the user, not a 0% score or a script error.
    const o = run.output;
    if ((skill === 'detect' && typeof o?.ai !== 'number') || (skill === 'humanize' && typeof o?.text !== 'string')) {
      return showError(new ApiError(502, 'bad_output', "p3n sent an answer this version of the add-on can't read. Try again in a moment."));
    }
    let body;
    if (skill === 'detect') body = R.renderDetect(o);
    else if (skill === 'humanize') {
      // Replace only while what was rewritten is the document's text, not text typed or edited in the box.
      const fromDoc = state.source?.text === text;
      body = R.renderHumanize(o, text, {
        replace: fromDoc && state.source.editable ? { label: 'Replace selection', run: (rewrite, button, status) => replaceInDocument(text, rewrite, button, status) } : null,
        note: fromDoc && state.source.blocked ? `${BLOCKED[state.source.blocked] ?? BLOCKED.other}, so p3n won't paste over it. Copy the rewrite and paste it where you want it.` : null,
        copy: HOST.copy,
        retry: () => start('humanize', text, { fresh: true }),
      });
    } else body = [h('div', { class: 'rewrite' }, o?.text ?? '')];
    els.result.replaceChildren(R.result(run, body, { key: key() }));
  }

  async function replaceInDocument(sent, rewrite, button, status) {
    const say = (msg, kind) => { status.textContent = msg; status.className = `note small ${kind}`; status.hidden = false; };
    // Another selection was taken in since this rewrite: it isn't the text this rewrite belongs to.
    if (state.source?.text !== sent) {
      return say('You took other text from the document since this rewrite. Rewrite that text, or copy this one.', 'warn');
    }
    button.disabled = true;
    button.textContent = 'Replacing…';
    let r;
    try {
      r = await HOST.replace(rewrite);
    } catch (e) {
      r = { ok: false, reason: 'error', detail: e.message };
    }
    if (r?.ok) {
      R.done(button, 'Replaced', { ok: true });
      return say(`Replaced in the document and selected there. ${HOST.undoKey()} in the document undoes it.`, 'ok');
    }
    button.disabled = false;
    button.textContent = 'Replace selection';
    if (r?.reason === 'error') return say(r.detail, 'warn');
    const why = {
      changed: 'The selected text changed since p3n read it, so p3n left the document alone.',
      gone: 'That text isn\'t selected any more, and p3n couldn\'t find it once in the document.',
      locked: 'Docs didn\'t allow the edit. You may only have view or comment access.',
      empty: 'The rewrite came back empty, so p3n left the document alone.',
    }[r?.reason] ?? (BLOCKED[r?.reason] ? `${BLOCKED[r.reason]}, so p3n won't paste over it.` : 'p3n couldn\'t put the text back.');
    say(`${why} Select the text again and click Use selection, or copy the rewrite and paste it.`, 'warn');
  }

  function showError(e) {
    els.result.replaceChildren(R.error(e, { links: LINKS, onKey: () => openSettings() }));
  }

  // ---- account / quota ---------------------------------------------------------------------------

  async function refreshAccount() {
    els.account.textContent = key() ? 'API key' : 'Add API key';
    if (!key()) {
      const free = HOST.free.get();
      els.quota.textContent = free != null
        ? `${free} free ${free === 1 ? 'call' : 'calls'} left this hour without a key.`
        : 'Free without a key: 10 calls an hour, up to 5,000 characters each.';
      return;
    }
    try {
      const m = await api.me(key());
      els.quota.textContent = `Balance $${Number(m.balance_usd).toFixed(2)} · key ${m.key?.name ?? m.key?.prefix ?? ''}`;
    } catch (e) {
      els.quota.textContent = e.type === 'unauthorized' ? 'Your API key wasn\'t accepted. Change it under API key.' : '';
    }
  }

  // ---- settings: the API key, checked with p3n before it's saved ---------------------------------

  // The settings view slides over the main one (View Transitions where the browser has them). Resolves once the
  // new view is in place: a transition applies it a frame or more later, and focus can't land on a hidden field.
  function swap(toSettings) {
    const apply = () => {
      els.main.hidden = toSettings;
      els.settings.hidden = !toSettings;
      els.foot.hidden = toSettings;
      document.documentElement.dataset.view = toSettings ? 'settings' : 'main';
    };
    if (document.startViewTransition && !R.calm.matches) return document.startViewTransition(apply).updateCallbackDone.catch(() => {});
    apply();
    return Promise.resolve();
  }

  function openSettings() {
    if (HOST.openSettings) return HOST.openSettings();
    els.key.value = key();
    say('');
    swap(true).then(() => els.key.focus());
    if (key()) checkAndSave(key());
  }

  function closeSettings() {
    swap(false).then(() => els.account.focus());
    refreshInput();
    refreshAccount();
  }

  els.account.addEventListener('click', openSettings);
  els.back.addEventListener('click', closeSettings);
  els.settings.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSettings(); });

  function say(msg, kind = '') {
    els.keyStatus.textContent = msg;
    els.keyStatus.className = `note small ${kind}`;
    els.keyStatus.hidden = !msg;
    if (msg && !R.calm.matches) {
      els.keyStatus.animate([{ opacity: 0, transform: 'translateY(4px)' }, {}], { duration: 200, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' });
    }
  }

  // Saves a key only if p3n accepts it, so a typo never replaces a good key.
  let pending = 0;
  async function checkAndSave(k) {
    const mine = ++pending;
    say('Checking the key…');
    try {
      const m = await api.me(k);
      if (mine !== pending) return;
      if (k !== key()) {
        try {
          await HOST.setKey(k);
        } catch {
          return say('The key works, but Google didn\'t let p3n save it. Try again in a moment.', 'warn');
        }
        if (mine !== pending) return;
      }
      say(`Saved. Signed in as ${m.email}, balance $${Number(m.balance_usd).toFixed(2)}.`, 'ok');
    } catch (e) {
      if (mine !== pending) return;
      say(e.type === 'unauthorized' ? 'p3n doesn\'t accept this key, so it wasn\'t saved. Copy it again from the API keys page.' : e.message, 'error');
    }
  }

  let debounce;
  els.key.addEventListener('input', () => {
    clearTimeout(debounce);
    pending++;
    const k = els.key.value.trim();
    if (!k) return say('');
    if (!/^p3n_[0-9a-f]{12}_[A-Za-z0-9]{32}$/.test(k)) return say('Keys look like p3n_ followed by two groups of letters and digits. Copy the whole key from the API keys page.', 'warn');
    debounce = setTimeout(() => checkAndSave(k), 400);
  });

  els.remove.addEventListener('click', async () => {
    pending++;
    try {
      await HOST.setKey('');
    } catch {
      return say('Google didn\'t let p3n remove the key. Try again in a moment.', 'warn');
    }
    els.key.value = '';
    say('Key removed. p3n still works without one, with the free hourly limit.');
  });

  // ---- boot --------------------------------------------------------------------------------------

  els.mock.hidden = !HOST.mock;
  document.documentElement.dataset.view = 'main';
  refreshInput();
  refreshAccount();
  if (!HOST.available) {
    hint('Open p3n from Extensions in Google Docs to use your selection. You can paste text here meanwhile.');
  } else if (HOST.job) {
    // Opened from Extensions → p3n → Check or Rewrite: run it on the selection.
    go(HOST.job);
  } else {
    // Opened with text selected: take it in, send nothing yet.
    grab({ quiet: true, background: true });
  }
})();
</script>
